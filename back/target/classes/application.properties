spring.application.name=appbitb2g

# =========================================================================
# ⚙️ CONFIGURACIÓN DE BASE DE DATOS MYSQL (Con valores por defecto / fallback)
# =========================================================================
# Si no existen las variables de entorno, se conectará de manera local a:
# - Host: localhost
# - Puerto: 3306
# - Base de Datos: appbit
# =========================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:appbit}?createDatabaseIfNoExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA e Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (opcional para depurar tus consultas si usas el repositorio)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================================
# 📋 CONFIGURACIÓN COMPARTIDA DE FORMATO JSON
# =========================================================================
# Transforma automáticamente camelCase de Java a snake_case en los JSON de respuesta
spring.jackson.property-naming-strategy=SNAKE_CASE
