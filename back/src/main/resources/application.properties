spring.application.name=appbitb2g

#Configuración de la BD MySQL en Docker

spring.datasource.url= jdbc:mysql://${DB_HOST}:${BD_PORT}/${DB_NAME}?createDatabaseIfNoExist=true&serverTimezone=UT&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver
