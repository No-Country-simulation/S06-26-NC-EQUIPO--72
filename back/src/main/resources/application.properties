 spring.application.name=appbitb2g
server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hot reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
# Le dice a devtools que mire los .class compilados
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,public/**,templates/**


# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=true


# URL del servicio de IA
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
# API key compartida con el AI Service. Si está vacía,
# el WebClient no envía el header X-API-Key (compatibilidad con dev local).
ai.service.api-token=${AI_SERVICE_API_TOKEN:}