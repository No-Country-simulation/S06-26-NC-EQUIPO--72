services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: app-bit-b2g
    restart: always
    ports:
      - "8080:8080"
    networks:
      - bit-b2g-network
  

  react-frontend:
    container_name: react_app
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: always

    environment:
      - VITE_API_URL=${VITE_API_URL}
      - HOST=0.0.0.0
      - NODE_ENV=development

    volumes:
      - ./front:/app
      - /app/node_modules  
    ports:
      - "5173:5173"
    networks:
      - bit-b2g-network
    depends_on:
      - backend  


     
networks:
  bit-b2g-network:  

     