services:

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: Appbitb2g_PhpMyAdmin
    restart: always
    mem_limit: 50M
    mem_reservation: 50M
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: Appbitb2g_Mysql
    restart: always
    mem_limit: 600M
    memswap_limit: 600M
    command: >
      --default-authentication-plugin=mysql_native_password
      --local-infile=1
      --innodb-redo-log-capacity=64M
      --innodb-log-buffer-size=8M
      --innodb-flush-log-at-trx-commit=2
      --innodb-buffer-pool-size=128M
      --slow_query_log=1
      --long_query_time=0
      --log_queries_not_using_indexes=1
      --performance-schema=OFF
      --max-connections=20
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      DB_READONLY_USER: ${DB_READONLY_USER}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.dev
    container_name: Appbitb2g
    restart: always
    mem_limit: 1200M
    memswap_limit: 1200M
    ports:
      - "8080:8080"
    volumes:
      - ./back:/app
      - ~/.m2:/root/.m2
      - /app/target
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${DB_NAME}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true
      - LOGGING_LEVEL_ORG_HIBERNATE_ORM_RESULTS_BASIC=TRACE
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      # Optimizaciones JVM para desarrollo
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xss512k -XX:MaxRAMPercentage=70.0 -XX:+UseContainerSupport
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - SERVER_TOMCAT_MAX_CONNECTIONS=20
      - SERVER_TOMCAT_THREADS_MAX=5
      - SERVER_TOMCAT_THREADS_MIN_SPARE=1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - app-network

  react-frontend:
    container_name: react_app
    build:
      context: ./front
      dockerfile: Dockerfile
    mem_limit: 600M
    memswap_limit: 600M
    restart: always
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - HOST=0.0.0.0
      - NODE_ENV=development
      # Limitar heap de Node a 350MB (deja margen para overhead del proceso)
      - NODE_OPTIONS=--max-old-space-size=350
    volumes:
      - ./front:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: Appbitb2g_Qdrant
    restart: always
    mem_limit: 400M
    memswap_limit: 400M
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: Appbitb2g_AI
    restart: always
    # 1600M: el eval DSPy (--use-compiled) carga dspy+optuna+litellm además del
    # agente completo; con 900M el OOM killer mataba el proceso.
    mem_limit: 1600M
    memswap_limit: 1600M
    ports:
      - "8000:8000"
    volumes:
      - ./ai:/app
      - /app/__pycache__
      - ./ai/data:/app/data
    env_file:
      - ./ai/.env
    environment:
      - DB_READONLY_USER=${DB_READONLY_USER}
      - DB_READONLY_PASSWORD=${DB_READONLY_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - app-network

volumes:
  mysql_data:
  qdrant_data:

networks:
  app-network:
    driver: bridge